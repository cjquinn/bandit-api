version: '2'
services:
  nginx:
    image: cjquinn/cakephp-nginx
    ports:
     - 80:80
    volumes:
     - .:/usr/share/nginx/html
    networks:
     - network
  fpm:
    image: cjquinn/cakephp-fpm
    volumes:
     - .:/usr/share/nginx/html
    networks:
     - network
  db:
    image: mysql:5.7
    ports:
     - 3306:3306
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: bandit
      MYSQL_USER: docker
      MYSQL_PASSWORD: secret
    volumes:
     - data:/var/lib/mysql
    networks:
     - network
networks:
  network:
    driver: bridge
volumes:
  data:
    driver: local